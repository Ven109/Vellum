name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @vellum/web exec playwright install --with-deps chromium
      - run: pnpm -r --if-present run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  selfhost:
    name: Self-hosting (Docker Compose)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # Compose requires the storage credentials; CI makes throwaway ones.
      - name: Create .env
        run: printf 'STORAGE_ACCESS_KEY=ci%s\nSTORAGE_SECRET_KEY=%s\n' "$(openssl rand -hex 6)" "$(openssl rand -hex 20)" > .env
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Build the image
        run: docker compose build vellum
      - name: Start the stack
        run: docker compose up -d --no-build
      - name: Smoke test
        run: ./scripts/smoke-selfhost.sh
      - name: Logs
        if: failure()
        run: docker compose logs

  build:
    name: Build (${{ matrix.target }} on ${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
          - os: ubuntu-latest
            target: desktop
          - os: macos-latest
            target: desktop
          - os: windows-latest
            target: desktop
    runs-on: ${{ matrix.os }}
    env:
      # Only the desktop builds need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ matrix.target == 'web' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        if: matrix.target == 'web'
        run: pnpm -r --if-present --filter "!@vellum/desktop" run build
      - name: Build desktop (unsigned)
        if: matrix.target == 'desktop'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @vellum/desktop --if-present run package
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses; allow them rather
      # than run the app without its sandbox.
      - name: Allow the Chromium sandbox
        if: matrix.target == 'desktop' && runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check desktop budgets
        if: matrix.target == 'desktop'
        run: pnpm --filter @vellum/desktop --if-present run budget
      # Electron downloads its binary on first use; do it up front instead of inside a test's timeout.
      - name: Install the Electron binary
        if: matrix.target == 'desktop'
        run: pnpm --filter @vellum/desktop exec install-electron
      - name: Desktop tests
        if: matrix.target == 'desktop' && runner.os != 'Linux'
        run: pnpm --filter @vellum/desktop exec playwright test
      - name: Desktop tests (virtual display)
        if: matrix.target == 'desktop' && runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @vellum/desktop exec playwright test
